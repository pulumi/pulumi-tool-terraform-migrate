name: Weekly Release

on:
  schedule:
    # Run weekly on Tuesdays at 9:00 UTC, the day after the Monday providermap update
    - cron: '0 9 * * 2'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # full history and tags are needed to find the latest tag
          persist-credentials: false

      - name: Generate Pulumi Access Token
        id: generate_pulumi_token
        uses: pulumi/auth-actions@141415910c3beb54e03b48e9057c204c97b956f2 # v2.1.0
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          export-environment-variables: false
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@9eb774255b1a4afb7855678ae8d4a77359da0d9b
        env:
          ESC_ACTION_ENVIRONMENT: github-secrets/${{ github.repository_owner }}-${{ github.event.repository.name }}
          ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: "false"
          ESC_ACTION_OIDC_AUTH: "true"
          ESC_ACTION_OIDC_ORGANIZATION: pulumi
          ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          count=$(git rev-list "${latest}..HEAD" --count)
          if [ "$count" -eq 0 ]; then
            echo "No commits since ${latest}; skipping this week's release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          patch="${latest##*.}"
          next="${latest%.*}.$((patch + 1))"
          echo "Releasing ${next} (${count} commits since ${latest})"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.version.outputs.skip == 'false'
        run: |
          # A release created with the default GITHUB_TOKEN would not trigger
          # release.yml on the tag push, leaving a release without binaries.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::No bot token available from ESC; refusing to create a release that would not trigger the binary build."
            exit 1
          fi
          gh release create "${{ steps.version.outputs.next }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.next }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ steps.esc-secrets.outputs.PULUMI_PROVIDER_AUTOMATION_TOKEN || steps.esc-secrets.outputs.PULUMI_BOT_TOKEN }}
